
services:
  postgres:
    image: postgres:17
    container_name: hotelaria-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: hotelaria
      POSTGRES_USER: hotelaria_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:9753:5432"

    volumes:
      - hotelaria_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelaria_app -d hotelaria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotelaria_data:
